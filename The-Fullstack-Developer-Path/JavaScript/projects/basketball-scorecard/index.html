
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1b244a" />
  <meta name="description" content="A simple interactive basketball scoreboard." />

  <title>Basketball Scoreboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>

<body>
  <main class="scoreboard" id="scoreboard">
    <header class="scoreboard__header">
      <p class="scoreboard__eyebrow">LIVE GAME</p>
      <h1>BASKETBALL SCOREBOARD</h1>
      <p class="scoreboard__subtitle">Keep track of every point.</p>
    </header>

    <div class="scoreboard__teams">

      <!-- Home Team -->
      <section class="team" aria-labelledby="home-team-name">
        <label class="team__name-label" for="home-team-name">
          HOME TEAM
        </label>

        <input
          class="team__name"
          id="home-team-name"
          type="text"
          value="HOME"
          maxlength="20"
          aria-label="Home team name"
        />

        <div class="score-container">
          <output
            class="score"
            id="home-score"
            aria-label="Home team score"
            aria-live="polite"
            aria-atomic="true"
          >0</output>
        </div>

        <div class="team__controls">
          <button type="button" class="score-button" data-team="home" data-points="1">
            +1
          </button>
          <button type="button" class="score-button" data-team="home" data-points="2">
            +2
          </button>
          <button type="button" class="score-button" data-team="home" data-points="3">
            +3
          </button>
        </div>

        <button type="button" class="undo-button" data-team="home">
          − 1 POINT
        </button>
      </section>

      <!-- Guest Team -->
      <section class="team" aria-labelledby="guest-team-name">
        <label class="team__name-label" for="guest-team-name">
          AWAY TEAM
        </label>

        <input
          class="team__name"
          id="guest-team-name"
          type="text"
          value="GUEST"
          maxlength="20"
          aria-label="Away team name"
        />

        <div class="score-container">
          <output
            class="score"
            id="guest-score"
            aria-label="Away team score"
            aria-live="polite"
            aria-atomic="true"
          >0</output>
        </div>

        <div class="team__controls">
          <button type="button" class="score-button" data-team="guest" data-points="1">
            +1
          </button>
          <button type="button" class="score-button" data-team="guest" data-points="2">
            +2
          </button>
          <button type="button" class="score-button" data-team="guest" data-points="3">
            +3
          </button>
        </div>

        <button type="button" class="undo-button" data-team="guest">
          − 1 POINT
        </button>
      </section>
    </div>

    <footer class="scoreboard__footer">
      <p id="game-status" role="status" aria-live="polite">
        Game ready
      </p>

      <button type="button" id="reset-button" class="reset-button">
        ↻ NEW GAME
      </button>
    </footer>
  </main>
</body>
</html>
